<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Empresa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
    .form-container {
        background-color: #eaf2ea; 
    }
    body {
    background-color: #97bc97;
}
h2 {
    color: #000000; 
    font-size: 33px;
    text-align: center;
}
/*letra de los campos de info*/
.form-control::placeholder {
    color: #1c421a; 
    font-style: italic; 
}
label {
    display: none;
}
/*estilo de los campos de info*/
.form-control {
    background-color: #b2d2b2; 
    border: 1px solid #76b276; 
    padding: 10px; 
    font-size: 16px; 
    border-radius: 15px;
}
/*efecto de color campos de info*/
.form-control:focus {
    background-color: #e2e0cd;
    border-color: #d4cd8d;
}
/*cuadro de los iconos*/
.input-group-text {
    background-color: #94c294;
    border: 1px solid #76b276; 
    color: white; 
    border-radius: 15px;
}
.boton {
    background-color: #244924; 
    border: 1px solid #183018; 
    color: white; 
    font-size: 18px; 
    padding: 10px 20px; 
    border-radius: 15px; 
}

.boton:hover {
    background-color: #335d33; 
}

    </style>
</head>

<body>
    <div class="container mt-5">
        <form action="registrar.php" method="POST" class="p-4 rounded shadow form-container">
            <h2 class="text-center">Registrar Empresa</h2>
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="bi bi-building"></i></span>
                <input type="text" class="form-control" id="empresa" name="empresa" placeholder="Nombre de la empresa" required>
            </div>
            <div class="mb-3">
                <div class="input-group">
                 <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                 <input type="text" class="form-control" id="representante" name="representante" placeholder="Representante legal" required>
                </div>
            </div>
            
            <div class="mb-3">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-tags"></i></span>
                    <select class="form-control" id="categoria" name="categoria" required>
                     <option value="" disabled selected>Selecciona una categoria</option>
                     <option value="Vehiculos">Vehiculos</option>
                     <option value="Supermercado">Supermercado</option>
                     <option value="Tecnologia">Tecnologia</option>
                     <option value="Electrodomesticos">Electrodomesticos</option>
                     <option value="Hogar y Muebles">Hogar y Muebles</option>
                     <option value="Deportes">Deportes</option>
                     <option value="Maquillaje y Cuidado personal">Maquillaje y Cuidado personal</option>
                     <option value="Construccion y Herramientas">Construccion y Herramientas</option>
                     <option value="Otro">Otro</option>
                    </select>
                </div>
            </div>
            
            <div class="mb-3">
                <div class="input-group">
                 <span class="input-group-text"><i class="bi bi-123"></i></span>
                <input type="number" class="form-control" id="nit" name="nit" placeholder="NIT" required>
                </div>
            </div>
            
            <div class="mb-3">
                <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" name="email" placeholder="Correo electronico" required>
                </div>
            </div>
            
            <div class="mb-3">
                <div class="input-group">
                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                <input type="number" class="form-control" id="telefono" name="telefono" placeholder="Numero telefonico" required>
                </div>
            </div>
            
            <div class="mb-3">
                <div class="input-group">
                <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Direccion" required>
             </div>

             <input type="text" id="id_empresas" name="id_empresas" style="visibility:hidden;">
            
            <div class="text-center">
                <button type="submit" class="boton">Crear Registro</button>
            </div>

    </form>
    </div>

</body>
</html>
